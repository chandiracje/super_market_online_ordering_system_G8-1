<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register - Supermarket</title>
</head>
<body>
<h2>Register a New Account</h2>

<!-- Display Error Message if Passwords don't match -->
<div th:if="${error}">
    <p style="color: red;" th:text="${error}"></p>
</div>

<form th:action="@{/register}" th:object="${user}" method="post">
    <div>
        <label>Full Name:</label>
        <input type="text" th:field="*{fullName}" required />
    </div>
    <div>
        <label>Email:</label>
        <input type="email" th:field="*{email}" required />
    </div>
    <div>
        <label>Password:</label>
        <input type="password" th:field="*{password}" required />
    </div>
    <div>
        <label>Confirm Password:</label>
        <!-- Maps to the DTO's confirmPassword field -->
        <input type="password" th:field="*{confirmPassword}" required />
    </div>
    <div>
        <label>Default Shipping Address (Optional):</label>
        <textarea th:field="*{defaultShippingAddress}"></textarea>
    </div>
    <button type="submit">Register</button>
</form>

<p>Already have an account? <a th:href="@{/login}">Login here</a></p>
</body>
</html>
